<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Karte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 2px solid black;
            width: 150px;
            height: 100px;
            text-align: center;
            vertical-align: middle;
            font-size: 24px;
            cursor: pointer;
            background-color: #303030;
            color: white;
            text-shadow: 2px 2px 4px black;
        }
        td.clicked {
            background-color: rgb(2, 134, 2);
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
        input[type="file"] {
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <button onclick="generateNewCard()">Neue Karte generieren</button>
    <div id="bingo-card">
        <table>
            <tbody>
                <!-- Bingokarte wird hier generiert -->
            </tbody>
        </table>
    </div>
    
    <script>
        let phrases = [
            "Feru singt",
            "Light ist Schuld",
            "GIGGI!!!",
            "Mods sind Schuld",
            "Feru flucht",
            "cute aggression moment",
            "Feru sagt 67",
            "LEEEEEE",
            "*Burp*",
            "Mocca Moment",
            "Feru hat Demenz",
            "Sub-Bombe 20er",
            "Feru macht prediction",
            "Chat trollt",
            "Free Space",
            "scuff",
            "fremde Sprache im Chat",
            "emotes werden gespamt",
            "fortnite Sieg(?)",
            "CLIFF DARF BANNEN!!!!",
            "Jumpscare",
            "Feru kann nicht lesen",
            "Feru hat neuen Crush auf Charakter",
            "Irgendwie ist Yura schuld",
            "Chat schlägt anderes game vor",
            "jemand fragt was los ist"
        ];


        function generateNewCard() {

            const selectedPhrases = phrases.sort(() => 0.5 - Math.random()).slice(0, 25);

            const tbody = document.querySelector('tbody');
            tbody.innerHTML = '';  // Leere die aktuelle Tabelle
            for (let i = 0; i < 5; i++) {
                const row = document.createElement('tr');
                for (let j = 0; j < 5; j++) {
                    const cell = document.createElement('td');
                    cell.textContent = selectedPhrases[i * 5 + j];
                    cell.addEventListener('click', () => {
                        cell.classList.toggle('clicked');
                    });
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
            }
        }
    </script>
</body>
</html>
